<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Group Chat</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<link rel="stylesheet" href="{{ url_for ('static', filename='style.css')}}">

<div class="app">

  <div class="header" id="headerToggle">
    <span class="edit-hint">edit ✎</span>
    <div class="group-name" id="groupNameDisplay">#devs-only</div>
    <div class="group-sub" id="groupSubDisplay">you, marlon, riko +2</div>
  </div>

  <div class="auth-buttons">
  {% if current_user == '<anonymous>' %}
    <a href="/login" class="auth-btn">login</a>
    <a href="/register" class="auth-btn">register</a>
  {% else %}
    <span class="auth-user">{{ current_user }}</span>
    <a href="/logout" class="auth-btn">logout</a>
  {% endif %}
  </div>

  <div class="edit-panel" id="editPanel">
    <div>
      <label>Group name</label>
      <input type="text" id="nameInput" value="#devs-only">
    </div>
    <div>
      <label>Description</label>
      <textarea id="descInput" rows="2">you, marlon, riko +2</textarea>
    </div>
    <div class="edit-actions">
      <button class="btn btn-cancel" id="cancelEdit">cancel</button>
      <button class="btn btn-save" id="saveEdit">save</button>
    </div>
  </div>

  <div class="messages" id="messages">
    {% for sender, content, sent_at in messages %}
     <div class="line{% if sender == current_user %} self{% endif %}">
      <span class="time">{{ sent_at.strftime('%H:%H')}}</span>
      <span class="sender">{{ sender }}:</span>{{ content }}
     </div>
    {% endfor %}
  </div>

  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="type a message and hit enter">
    <button class="send-btn" id="sendBtn">send</button>
  </div>

</div>

<script>
  const socket = io();  // connects to the server automatically

  const messages = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const currentUser = "{{ current_user }}";

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    socket.emit('send_message', { content: text });  // fires the event to the server
    msgInput.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // this fires whenever the SERVER broadcasts a new message to everyone
  socket.on('new_message', (data) => {
    const div = document.createElement('div');
    div.className = 'line' + (data.sender === currentUser ? ' self' : '');
    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', hour12: false});
    div.innerHTML = `<span class="time">${time}</span><span class="sender">${data.sender}:</span>${data.content.replace(/</g,'&lt;')}`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
</script>

</body>
</html>
