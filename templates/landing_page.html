<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chatroom // join</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #060606;
  --ink: #e6e6e2;
  --dim: #9a9a92;
  --line: #3a3a34;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', 'Courier New', ui-monospace, monospace;
  overflow-x: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  letter-spacing: 0.02em;
}

.rain-layer {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: space-between;
  overflow: hidden;
  pointer-events: none;
  white-space: pre;
}

.rain-col {
  flex: 1 1 0;
  text-align: center;
  white-space: pre;
  animation-name: rainfall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

@keyframes rainfall {
  0% { transform: translateY(-50%); }
  100% { transform: translateY(0%); }
}

#layer1 { z-index: 1; opacity: 0.10; font-size: 13px; line-height: 1.5; }
#layer2 { z-index: 0; opacity: 0.20; font-size: 11px; line-height: 1.45; }
#layer3 { z-index: -1; opacity: 0.32; font-size: 9px; line-height: 1.4; }

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.018) 0px,
    rgba(255,255,255,0.018) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index: 5;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  z-index: 4;
}

.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 460px;
  z-index: 6;
  position: relative;
  padding: 20px;
}

.rule {
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.3em;
  margin-bottom: 22px;
  white-space: pre;
}

.banner {
  font-size: clamp(26px, 6vw, 44px);
  font-weight: 700;
  letter-spacing: 0.1em;
  line-height: 1.15;
  margin-bottom: 6px;
}

.banner span { display: inline-block; }

.subrule {
  color: var(--dim);
  font-size: 11px;
  letter-spacing: 0.25em;
  margin-top: 4px;
  margin-bottom: 28px;
}

.tagline {
  color: var(--dim);
  font-size: 13px;
  letter-spacing: 0.05em;
  margin-bottom: 40px;
  min-height: 18px;
}

.tagline .cursor {
  display: inline-block;
  width: 8px;
  height: 13px;
  background: var(--ink);
  margin-left: 4px;
  animation: blink 1.1s step-start infinite;
  vertical-align: -2px;
}

@keyframes blink { 50% { opacity: 0; } }

.join-btn {
  appearance: none;
  border: none;
  background: var(--ink);
  color: var(--bg);
  font-family: inherit;
  cursor: pointer;
  padding: 14px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.12s ease, background 0.12s ease;
}

.join-btn:hover { background: #fff; transform: translateY(-1px); }
.join-btn:active { transform: translateY(0px); }

.join-btn .main {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.35em;
  text-transform: uppercase;
}

.join-btn .sub {
  font-size: 11px;
  letter-spacing: 0.12em;
  opacity: 0.6;
  text-transform: lowercase;
}

.divider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin: 26px 0 18px;
  color: var(--line);
  font-size: 10px;
  letter-spacing: 0.3em;
}

.divider-row .line { flex: 1; height: 1px; background: var(--line); }

.claim-text {
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}

.auth-link {
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-decoration: none;
  border-bottom: 1px solid var(--line);
  padding-bottom: 2px;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.auth-link:hover { color: var(--ink); border-color: var(--ink); }

.foot {
  position: fixed;
  bottom: 18px;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 0.2em;
  z-index: 6;
}
</style>
</head>
<body>

<div class="rain-layer" id="layer1"></div>
<div class="rain-layer" id="layer2"></div>
<div class="rain-layer" id="layer3"></div>

<div class="foot">[ no logs &nbsp;·&nbsp; no history &nbsp;·&nbsp; no names required ]</div>

<div class="center">
  <div class="rule">-=[ B. 2004 ]=-</div>

  <div class="banner">
    <span id="bannerLine1">C&#8226;O&#8226;N&#8226;T&#8226;A&#8226;I&#8226;N&#8226;E&#8226;D</span><br>
    <span>C&#8226;H&#8226;A&#8226;O&#8226;S</span>
  </div>
  <div class="subrule">// a room with no name on the door //</div>

  <div class="tagline">no signup required to lurk<span class="cursor"></span></div>

  <button class="join-btn" onclick="window.location.href='#anon'">
    <span class="main">join</span>
    <span class="sub">as &lt;anonymous&gt;</span>
  </button>

  <div class="divider-row">
    <div class="line"></div>
    <span>or</span>
    <div class="line"></div>
  </div>

  <div class="claim-text">claim your name and run your own group</div>
  <a class="auth-link" href="#auth">login / register</a>
</div>

<script>
const bashLines = [
  "$ sudo rm -rf /var/tmp/*",
  "ssh root@10.0.14.7",
  "nmap -sS 10.0.0.0/24",
  "chmod +x payload.sh",
  "> access_granted",
  "iptables -A INPUT -j DROP",
  "sha256sum core.bin",
  "0x4E 0x6F 0x6E 0x65",
  "curl -s http://mirror/init.sh | bash",
  "kill -9 $(pgrep watcher)",
  "tar -xzvf archive.tar.gz",
  "grep -R 'token' ./",
  "openssl enc -aes-256-cbc",
  "echo $PATH",
  "cat /dev/null > log.txt",
  "wget -q http://relay/pkg",
  "python3 exploit.py --target",
  "ping -c 1 10.0.0.1",
  "history -c",
  "export SHELL=/bin/bash",
  "netstat -tulnp",
  "base64 -d payload.b64",
  "chown root:root ./bin",
  "gpg --decrypt msg.asc",
  "find / -perm -4000",
  "ln -s /dev/null .bash_history"
];

function buildLayer(id, columns, lineHeightPx, minDur, maxDur) {
  const layer = document.getElementById(id);
  // each copy must be taller than the viewport, or the loop runs out of
  // content near the end of the cycle and snaps/flashes when it resets.
  // 1.4x viewport height gives comfortable margin on any screen size.
  const copyHeightPx = window.innerHeight * 1.4;
  const linesPerCol = Math.ceil(copyHeightPx / lineHeightPx);

  for (let i = 0; i < columns; i++) {
    const col = document.createElement('div');
    col.className = 'rain-col';
    let text = '';
    for (let j = 0; j < linesPerCol; j++) {
      text += bashLines[Math.floor(Math.random() * bashLines.length)] + '\n';
    }
    col.textContent = text + text;
    const duration = Math.random() * (maxDur - minDur) + minDur;
    col.style.animationDuration = duration.toFixed(1) + 's';
    col.style.animationDelay = (-Math.random() * duration).toFixed(1) + 's';
    layer.appendChild(col);
  }
}

// lineHeightPx = font-size * line-height multiplier for each layer, from the CSS above
buildLayer('layer1', 22, 13 * 1.5, 9, 16);
buildLayer('layer2', 18, 11 * 1.45, 16, 26);
buildLayer('layer3', 14, 9 * 1.4, 26, 40);

function fitBanner() {
  const banner = document.querySelector('.banner');
  const line1 = document.getElementById('bannerLine1');
  if (window.innerWidth > 700) {
    banner.style.fontSize = '';
    return;
  }
  banner.style.fontSize = '10px';
  const naturalWidth = line1.getBoundingClientRect().width;
  const targetWidth = window.innerWidth * 0.92;
  const scale = targetWidth / naturalWidth;
  banner.style.fontSize = (10 * scale).toFixed(1) + 'px';
}

window.addEventListener('load', fitBanner);
window.addEventListener('resize', fitBanner);
window.addEventListener('orientationchange', fitBanner);
</script>

</body>
</html>
